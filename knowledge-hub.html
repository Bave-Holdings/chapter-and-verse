<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter &amp; Verse — Intellence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#0A1527;
    --ink-2:#132238;
    --ink-3:#1B2E48;
    --ink-line: rgba(255,255,255,0.09);
    --paper:#F5F7F7;
    --paper-2:#FFFFFF;
    --line:#E2E7E6;
    --accent:#00FFC2;
    --accent-dark:#00C99B;
    --accent-tint:#E4FFF7;
    --accent-tint-line:#A9F2DC;
    --on-accent:#06231C;
    --text:#101B2C;
    --muted:#5C6B78;
    --muted-2:#8FA0AB;
    --danger:#A24B3F;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--paper);
    color:var(--text);
    overflow:hidden;
  }
  .serif{ font-family:'Space Grotesk', 'Inter', sans-serif; letter-spacing:-0.01em; }

  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ============ RAIL (categories) ============ */
  .rail{
    width:236px;
    flex-shrink:0;
    background:var(--ink);
    color:#EDEFEA;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--ink-line);
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 18px 16px 20px;
  }
  .brand-mark{
    width:30px;height:30px;
    flex-shrink:0;
    color:var(--accent);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{ width:26px;height:26px; }
  .brand-name{ font-size:15px; font-weight:500; color:#F3F4EF; line-height:1.1; }
  .brand-sub{ font-size:10.5px; color:var(--muted-2); margin-top:2px; letter-spacing:.02em; }

  .rail-user{
    display:flex;
    align-items:center;
    gap:11px;
    padding:16px 18px 18px 20px;
    border-top:1px solid var(--ink-line);
    border-bottom:1px solid var(--ink-line);
  }
  .avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--accent);
    color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15px;
    flex-shrink:0;
  }
  .rail-user .name{ font-size:14px; font-weight:600; color:#F3F4EF; line-height:1.2;}
  .rail-user .role{ font-size:11.5px; color:#8B98A5; margin-top:2px; }

  .rail-label{
    font-size:11px;
    letter-spacing:.02em;
    color:#697683;
    padding:18px 20px 8px;
  }

  .rail-nav{ flex:1; overflow-y:auto; padding-top:4px; }

  .rail-item{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    background:none;
    border:none;
    color:#C9D0D6;
    padding:10px 18px 10px 20px;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
    text-align:left;
    position:relative;
    border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .rail-item svg{ width:18px;height:18px; flex-shrink:0; opacity:.85; }
  .rail-item:hover{ background:var(--ink-2); color:#fff; }
  .rail-item.active{
    background:var(--ink-2);
    color:#fff;
    border-left:2px solid var(--accent);
  }
  .rail-item.active svg{ opacity:1; color:var(--accent); }
  .rail-item .count{
    margin-left:auto;
    font-size:11px;
    color:#71808D;
  }

  .rail-bottom{
    border-top:1px solid var(--ink-line);
    padding:8px 0 10px;
  }

  /* ============ SUBPANE (verticals) ============ */
  .subpane{
    width:0;
    flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--line);
    overflow:hidden;
    transition:width .18s ease;
  }
  .subpane.open{ width:272px; }
  .subpane-inner{ width:272px; height:100%; display:flex; flex-direction:column; }
  .subpane-head{
    padding:20px 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .subpane-head .eyebrow{ font-size:11px; color:var(--muted-2); margin-bottom:3px; }
  .subpane-head h2{
    margin:0;
    font-size:19px;
    font-weight:500;
  }
  .subpane-scroll{ flex:1; overflow-y:auto; padding:10px 0 18px; }
  .subpane-section-title{
    font-size:10.5px;
    color:var(--muted-2);
    padding:12px 18px 6px;
    letter-spacing:.02em;
  }
  .page-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px 9px 18px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--text);
    border-left:2px solid transparent;
  }
  .page-item:hover{ background:#F0F1EB; }
  .page-item.active{
    background:#EDE9DE;
    border-left:2px solid var(--accent);
    font-weight:500;
  }
  .page-item .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted-2);
    flex-shrink:0;
    opacity:.55;
  }
  .page-item.active .dot{ background:var(--accent-dark); opacity:1; }
  .page-item .label{ flex:1; line-height:1.35; }
  .page-item .pin-btn{
    opacity:0;
    background:none;border:none;cursor:pointer;
    color:var(--muted-2);
    padding:2px;
    display:flex;
  }
  .page-item:hover .pin-btn{ opacity:1; }
  .page-item .pin-btn.pinned{ opacity:1; color:var(--accent-dark); }
  .page-item .pin-btn svg{ width:14px;height:14px; }

  /* ============ MAIN (chat) ============ */
  .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }
  .main-header{
    padding:16px 26px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper-2);
  }
  .crumb{ font-size:11.5px; color:var(--muted); margin-bottom:3px; }
  .crumb b{ color:var(--muted); font-weight:500; }
  .main-header h1{
    margin:0;
    font-size:20px;
    font-weight:500;
  }
  .header-actions{ display:flex; gap:8px; }
  .icon-btn{
    width:32px;height:32px;
    border-radius:7px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--muted);
  }
  .icon-btn:hover{ background:#F0F1EB; }
  .icon-btn.pinned{ color:var(--on-accent); border-color:var(--accent-tint-line); background:var(--accent-tint); }
  .icon-btn svg{ width:16px;height:16px; }

  .chat-scroll{
    flex:1;
    overflow-y:auto;
    padding:26px 30px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .welcome{
    max-width:520px;
    margin:60px auto;
    text-align:center;
  }
  .welcome .mark{ font-size:13px; color:var(--muted-2); letter-spacing:.08em; margin-bottom:12px; text-transform:uppercase; }
  .welcome h1{ font-size:30px; font-weight:500; margin:0 0 12px; }
  .welcome p{ color:var(--muted); font-size:14.5px; line-height:1.6; margin:0 0 26px; }
  .welcome-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    text-align:left;
  }
  .welcome-chip{
    border:1px solid var(--line);
    background:var(--paper-2);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
  }
  .welcome-chip:hover{ border-color:var(--accent-dark); }
  .welcome-chip .cat{ display:block; font-size:11px; color:var(--muted-2); margin-bottom:3px; }

  .msg{ display:flex; gap:11px; max-width:78%; }
  .msg.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar{
    width:28px;height:28px;border-radius:50%;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:11.5px; font-weight:600;
  }
  .msg.bot .msg-avatar{ background:var(--ink); color:var(--accent); }
  .msg.user .msg-avatar{ background:var(--accent); color:var(--on-accent); }
  .bubble{
    background:var(--paper-2);
    border:1px solid var(--line);
    padding:11px 14px;
    border-radius:12px;
    font-size:13.8px;
    line-height:1.55;
  }
  .msg.user .bubble{ background:var(--ink); color:#EEF0EC; border-color:var(--ink); }
  .bubble .src{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:11.5px;
    color:var(--muted-2);
  }
  .typing{ display:flex; gap:4px; padding:3px 0; }
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--muted-2);
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){ animation-delay:.15s; }
  .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .composer{
    padding:16px 26px 20px;
    border-top:1px solid var(--line);
    background:var(--paper-2);
  }
  .composer-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px 8px 8px 16px;
  }
  .composer-box textarea{
    flex:1;
    border:none;
    background:none;
    resize:none;
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    padding:7px 0;
    max-height:120px;
    outline:none;
    color:var(--text);
  }
  .composer-box textarea::placeholder{ color:var(--muted-2); }
  .send-btn{
    width:36px;height:36px;
    border-radius:10px;
    background:var(--ink);
    color:var(--accent);
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .send-btn:hover{ background:var(--ink-2); }
  .send-btn svg{ width:16px;height:16px; }
  .composer-hint{
    font-size:11px;
    color:var(--muted-2);
    margin-top:8px;
    text-align:center;
  }

  /* ============ FAQ PANE ============ */
  .faq{
    width:280px;
    flex-shrink:0;
    background:var(--paper-2);
    border-left:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .faq-head{ padding:20px 18px 14px; border-bottom:1px solid var(--line); }
  .faq-head .eyebrow{ font-size:11px; color:var(--muted-2); margin-bottom:3px; }
  .faq-head h2{ margin:0; font-size:17px; font-weight:500; }
  .faq-scroll{ flex:1; overflow-y:auto; padding:14px 16px; }
  .faq-item{
    width:100%;
    text-align:left;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:12.8px;
    line-height:1.45;
    color:var(--text);
    cursor:pointer;
    margin-bottom:8px;
  }
  .faq-item:hover{ border-color:var(--accent-dark); background:var(--accent-tint); }
  .faq-foot{
    padding:14px 18px 18px;
    border-top:1px solid var(--line);
  }
  .faq-foot .title{ font-size:11px; color:var(--muted-2); margin-bottom:8px; }
  .doc-link{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--muted);
    padding:6px 0;
  }
  .doc-link svg{ width:14px;height:14px; color:var(--muted-2); flex-shrink:0; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#00000022; border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width:980px){
    .faq{ display:none; }
  }
  @media (max-width:760px){
    .subpane.open{ width:230px; }
    .rail{ width:64px; }
    .rail-user .name,.rail-user .role,.rail-item span.label-txt,.rail-label,.rail-item .count{ display:none; }
    .rail-user{ justify-content:center; padding:18px 0; }
    .rail-item{ justify-content:center; padding:12px 0; }
    .rail-item svg{ margin:0; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- RAIL -->
  <div class="rail">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="2.5" width="19" height="19" rx="6" stroke="currentColor" stroke-width="1.6"/><rect x="10.9" y="7" width="2.2" height="2.2" rx="1.1" fill="currentColor"/><rect x="10.9" y="10.6" width="2.2" height="6.4" rx="1.1" fill="currentColor"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name serif">Chapter &amp; Verse</div>
        <div class="brand-sub">by Intellence</div>

    <div class="rail-user">

      <div>

    <div class="rail-label">KNOWLEDGE</div>

      <button class="rail-item" id="helpBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="label-txt">Help &amp; feedback</span>
      </button>
    </div>
  </div>

  <!-- SUBPANE -->
  <div class="subpane" id="subpane">
    <div class="subpane-inner">
      <div class="subpane-head">
        <div class="eyebrow" id="subEyebrow">Category</div>
        <h2 class="serif" id="subTitle">—</h2>
      </div>
      <div class="subpane-scroll" id="subScroll"></div>
    </div>
  </div>

  <!-- MAIN CHAT -->
  <div class="main">
    <div class="main-header">
      <div>
        <div class="crumb" id="crumb">Knowledge Hub</div>
        <h1 class="serif" id="mainTitle">Good afternoon, Syed</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="pinCurrent" title="Pin this page" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/></svg>
        </button>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll"></div>

    <div class="composer">
      <div class="composer-box">
        <textarea id="composerInput" rows="1" placeholder="Ask a question about this policy…"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composerHint">Answers are drafted from the guidelines on file — always confirm exceptions with the policy owner.</div>
    </div>
  </div>

  <!-- FAQ -->
  <div class="faq">
    <div class="faq-head">
      <div class="eyebrow" id="faqEyebrow">Across the hub</div>
      <h2 class="serif" id="faqTitle">Frequently asked</h2>
    </div>
    <div class="faq-scroll" id="faqScroll"></div>
    <div class="faq-foot" id="faqFoot" style="display:none;">
      <div class="title">Source document</div>
      <div class="doc-link">

        <span id="docLinkLabel">Conventional_Guidelines_v9.pdf</span>
      </div>

  </div>

</div>

<script>
/* ---------------- ICONS ---------------- */
const ICONS = {
  mortgage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>',

  hr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3-1-6Z"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/></svg>'
};

/* ---------------- DATA ---------------- */

  mortgage: {
    label: 'Mortgage', icon: ICONS.mortgage,
    items: [
      { id:'conv',    label:'Conventional Guidelines', doc:'Conventional_Guidelines_v9.pdf' },
      { id:'nonqm',   label:'Non-QM Guidelines', doc:'NonQM_Guidelines_v4.pdf' },

      { id:'reic',  label:'Real Estate IC Guidelines', doc:'RE_IC_Guidelines_v2.pdf' },

      { id:'pubeq', label:'Public Equity Guidelines', doc:'Public_Equity_Guidelines_v3.pdf' },

  },
  compliance: {
    label:'Compliance', icon: ICONS.compliance,
    items: [
      { id:'riskmetrics', label:'Investment & Risk Metrics', doc:'Risk_Metrics_Policy_v4.pdf' },
      { id:'pertrade',    label:'Personal Trading Policy', doc:'Personal_Trading_Policy_v7.pdf' },
      { id:'coi',         label:'Conflict of Interest Policy', doc:'Conflict_of_Interest_v3.pdf' },
      { id:'ethics',      label:'Code of Ethics', doc:'Code_of_Ethics_v5.pdf' },
      { id:'regcal',      label:'Regulatory Filing Calendar', doc:'Reg_Filing_Calendar_2026.pdf' },
    ]
  },
  hr: {
    label:'HR', icon: ICONS.hr,
    items: [
      { id:'handbook', label:'Employee Handbook', doc:'Employee_Handbook_v11.pdf' },
      { id:'newhire',  label:'New Hire Policy', doc:'New_Hire_Policy_v3.pdf' },
      { id:'pto',      label:'PTO Policy', doc:'PTO_Policy_v6.pdf' },
      { id:'benefits', label:'Benefits Guide', doc:'Benefits_Guide_2026.pdf' },
      { id:'perf',     label:'Performance Review Policy', doc:'Performance_Review_Policy_v2.pdf' },
    ]
  }
};

const FAQ = {
  conv: ["What's the minimum credit score for a conventional loan?", "What's the maximum DTI allowed?", "Is mortgage insurance required below 20% down?", "What are this year's conforming loan limits?", "Can gift funds cover the entire down payment?"],
  nonqm: ["What income documentation qualifies for Non-QM?", "What's the max LTV on a bank-statement loan?", "Are Non-QM loans available to foreign nationals?", "Is there a prepayment penalty?", "What reserves are required?"],
  govt: ["What's the minimum score for an FHA loan?", "Can a VA loan be used for a second home?", "What areas qualify for USDA financing?", "What's the FHA upfront MIP rate?"],
  overlay: ["Which overlays apply on top of agency guidelines?", "How do overlays differ by loan program?", "Who approves an overlay exception?"],
  pricing: ["How often is the rate sheet updated?", "Where do I find today's pricing?", "How are rate locks extended?"],
  ips: ["What's the target asset allocation range?", "How often is the IPS reviewed?", "Who can approve a deviation from the IPS?"],
  ic: ["How often does the Investment Committee meet?", "What's the approval threshold for a new manager?", "How are IC decisions documented?"],
  reic: ["What's the maximum allocation to a single real estate deal?", "What due diligence is required before IC submission?", "How are appraisals reviewed?"],
  pcic: ["What's the minimum manager track record required?", "How is leverage evaluated in private credit deals?", "What's the reporting cadence for private credit managers?"],
  pubeq: ["What benchmark applies to public equity mandates?", "What's the tracking-error limit for active managers?", "How are proxy votes handled?"],
  riskmetrics: ["What VaR threshold triggers escalation?", "How is concentration risk measured?", "Who reviews the monthly risk report?"],
  pertrade: ["Do I need pre-clearance to trade individual stocks?", "What's the blackout period before earnings?", "How do I report a personal brokerage account?", "Are cryptocurrency trades covered?", "What's the minimum holding period?"],
  coi: ["How do I disclose an outside business activity?", "Are gifts from vendors allowed?", "What counts as a reportable relationship?"],
  ethics: ["What's the annual attestation deadline?", "Who do I report a suspected violation to?", "Does the code apply to contractors?"],
  regcal: ["When is the next Form ADV update due?", "What's the quarterly filing deadline?", "Who owns the SEC exam response?"],
  handbook: ["How many PTO days do I accrue per year?", "What's the remote-work policy?", "How do I report a workplace concern?", "How does the 401(k) match work?"],
  newhire: ["What's included in new-hire orientation?", "When does benefits eligibility start?", "What's the standard probationary period?"],
  pto: ["Can unused PTO roll over to next year?", "How far in advance should PTO be requested?", "How is PTO paid out on termination?"],
  benefits: ["When is open enrollment?", "What health plans are offered?", "Is there an HSA employer contribution?"],
  perf: ["When are annual reviews conducted?", "How are merit increases determined?", "What's the promotion cycle?"]
};

const GENERIC_FAQ = ["What's the most recent update to this policy?", "Who approves exceptions to this guideline?", "Where can I find the full document?", "Who do I contact with questions?"];

const TOP_ASKED = [
  {cat:'Mortgage', q:"What's the max DTI on a conventional loan?"},
  {cat:'Compliance', q:'Do I need pre-clearance to trade individual stocks?'},
  {cat:'HR', q:'How many PTO days do I accrue per year?'},
  {cat:'Investment', q:"What's the target asset allocation range?"},
  {cat:'Mortgage', q:'What income documentation qualifies for Non-QM?'},
];

/* ---------------- STATE ---------------- */
let activeCategory = null;
let activeItem = null;
let pinned = new Set(['pertrade']); // demo default pin
let subpaneOpen = false;

/* ---------------- HELPERS ---------------- */
function findItem(id){
  for (const catKey in DATA){
    const hit = DATA[catKey].items.find(i => i.id === id);
    if (hit) return { ...hit, catKey };
  }
  return null;
}

/* ---------------- RENDER: RAIL ---------------- */
function renderRail(){
  const nav = document.getElementById('railNav');
  nav.innerHTML = '';
  Object.keys(DATA).forEach(key => {
    const cat = DATA[key];
    const btn = document.createElement('button');
    btn.className = 'rail-item' + (activeCategory === key ? ' active' : '');
    btn.innerHTML = cat.icon + `<span class="label-txt">${cat.label}</span><span class="count">${cat.items.length}</span>`;
    btn.onclick = () => selectCategory(key);
    nav.appendChild(btn);
  });
}

function selectCategory(key){
  if (activeCategory === key && subpaneOpen){
    subpaneOpen = false;
  } else {
    activeCategory = key;
    subpaneOpen = true;
  }
  renderRail();
  renderSubpane();
}

/* ---------------- RENDER: SUBPANE ---------------- */
function renderSubpane(){
  const el = document.getElementById('subpane');
  el.classList.toggle('open', subpaneOpen);
  if (!subpaneOpen || !activeCategory) return;

  const cat = DATA[activeCategory];
  document.getElementById('subEyebrow').textContent = 'Category';
  document.getElementById('subTitle').textContent = cat.label;

  const scroll = document.getElementById('subScroll');
  scroll.innerHTML = '';

  const pinnedItems = cat.items.filter(i => pinned.has(i.id));
  if (pinnedItems.length){
    scroll.innerHTML += `<div class="subpane-section-title">PINNED</div>`;
    pinnedItems.forEach(i => scroll.appendChild(pageItemEl(i)));
  }
  scroll.innerHTML += `<div class="subpane-section-title">ALL PAGES</div>`;
  cat.items.forEach(i => scroll.appendChild(pageItemEl(i)));
}

function pageItemEl(item){
  const row = document.createElement('div');
  row.className = 'page-item' + (activeItem === item.id ? ' active' : '');
  const isPinned = pinned.has(item.id);
  row.innerHTML = `
    <span class="dot"></span>
    <span class="label">${item.label}</span>
    <button class="pin-btn ${isPinned ? 'pinned' : ''}" title="${isPinned ? 'Unpin' : 'Pin'}">${ICONS.pin}</button>
  `;
  row.querySelector('.label').onclick = () => selectItem(item.id);
  row.querySelector('.dot').onclick = () => selectItem(item.id);
  row.querySelector('.pin-btn').onclick = (e) => {
    e.stopPropagation();
    if (isPinned) pinned.delete(item.id); else pinned.add(item.id);
    renderSubpane();
    if (activeItem === item.id) renderHeader();
  };
  return row;
}

/* ---------------- RENDER: MAIN HEADER ---------------- */
function renderHeader(){
  const crumb = document.getElementById('crumb');
  const title = document.getElementById('mainTitle');
  const pinBtn = document.getElementById('pinCurrent');

  if (!activeItem){
    crumb.textContent = 'Knowledge Hub';
    title.textContent = 'Good afternoon, Syed';
    pinBtn.style.display = 'none';
    return;
  }
  const item = findItem(activeItem);
  const cat = DATA[item.catKey];
  crumb.innerHTML = `<b>${cat.label}</b> / ${item.label}`;
  title.textContent = item.label;
  pinBtn.style.display = 'flex';
  pinBtn.classList.toggle('pinned', pinned.has(item.id));
  pinBtn.onclick = () => {
    if (pinned.has(item.id)) pinned.delete(item.id); else pinned.add(item.id);
    renderHeader();
    renderSubpane();
  };
}

/* ---------------- RENDER: CHAT ---------------- */
function renderChat(){
  const scroll = document.getElementById('chatScroll');
  scroll.innerHTML = '';

  if (!activeItem){
    scroll.innerHTML = `
      <div class="welcome">
        <div class="mark serif">Chapter &amp; Verse</div>
        <h1 class="serif">What do you need to check today?</h1>
        <p>Pick a category on the left, or jump straight to one of the pages most people ask about.</p>
        <div class="welcome-grid" id="welcomeGrid"></div>
      </div>`;
    const grid = document.getElementById('welcomeGrid');
    TOP_ASKED.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'welcome-chip';
      chip.innerHTML = `<span class="cat">${t.cat}</span>${t.q}`;
      chip.onclick = () => {
        const catKey = Object.keys(DATA).find(k => DATA[k].label === t.cat);
        activeCategory = catKey; subpaneOpen = true;
        const first = DATA[catKey].items[0];
        selectItem(first.id);
        setTimeout(() => askQuestion(t.q), 150);
      };
      grid.appendChild(chip);
    });
    return;
  }

  const item = findItem(activeItem);
  addBotMessage(`You're looking at <b>${item.label}</b>. Ask me anything about it — I'll answer from the current policy on file and flag if a section looks out of date.`, item.doc, false);
}

function addUserMessage(text){
  const scroll = document.getElementById('chatScroll');
  const row = document.createElement('div');
  row.className = 'msg user';
  row.innerHTML = `<div class="msg-avatar">S</div><div class="bubble">${escapeHtml(text)}</div>`;
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
}

function addBotMessage(html, doc, cite=true){
  const scroll = document.getElementById('chatScroll');
  const row = document.createElement('div');
  row.className = 'msg bot';
  row.innerHTML = `<div class="msg-avatar">i</div><div class="bubble">${html}${cite && doc ? `<div class="src">Source — ${doc}</div>` : ''}</div>`;
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
}

function addTyping(){
  const scroll = document.getElementById('chatScroll');
  const row = document.createElement('div');
  row.className = 'msg bot';
  row.id = 'typingRow';
  row.innerHTML = `<div class="msg-avatar">i</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function askQuestion(text){
  if (!text.trim()) return;
  addUserMessage(text);
  addTyping();
  const item = activeItem ? findItem(activeItem) : null;
  setTimeout(() => {
    const typing = document.getElementById('typingRow');
    if (typing) typing.remove();
    const label = item ? item.label : 'the guidelines';
    addBotMessage(
      `Based on the current version of <b>${label}</b>, here's a draft answer to "${escapeHtml(text)}". This is a front-end prototype, so this reply is a placeholder — once connected to the real document set, this is where a sourced, page-referenced answer will appear.`,
      item ? item.doc : null
    );
  }, 900);
}

/* ---------------- RENDER: FAQ ---------------- */
function renderFaq(){
  const eyebrow = document.getElementById('faqEyebrow');
  const title = document.getElementById('faqTitle');
  const scroll = document.getElementById('faqScroll');
  const foot = document.getElementById('faqFoot');
  scroll.innerHTML = '';

  if (!activeItem){
    eyebrow.textContent = 'Across the hub';
    title.textContent = 'Most asked';
    foot.style.display = 'none';
    TOP_ASKED.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'faq-item';
      btn.textContent = t.q;
      btn.onclick = () => document.getElementById('composerInput').value = t.q;
      scroll.appendChild(btn);
    });
    return;
  }

  const item = findItem(activeItem);
  eyebrow.textContent = DATA[item.catKey].label;
  title.textContent = 'Frequently asked';
  const list = FAQ[item.id] || GENERIC_FAQ;
  list.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'faq-item';
    btn.textContent = q;
    btn.onclick = () => askQuestion(q);
    scroll.appendChild(btn);
  });
  foot.style.display = 'block';
  document.getElementById('docLinkLabel').textContent = item.doc;
}

/* ---------------- SELECT ITEM ---------------- */
function selectItem(id){
  activeItem = id;
  renderSubpane();
  renderHeader();
  renderChat();
  renderFaq();
}

/* ---------------- COMPOSER ---------------- */
const input = document.getElementById('composerInput');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    submitComposer();
  }
});
document.getElementById('sendBtn').onclick = submitComposer;
function submitComposer(){
  const val = input.value;
  if (!val.trim()) return;
  askQuestion(val);
  input.value = '';
  input.style.height = 'auto';
}

/* ---------------- INIT ---------------- */
renderRail();
renderSubpane();
renderHeader();
renderChat();
renderFaq();
</script>
</body>
</html>
